{% extends 'base.html' %}

{% block content %}

<h2>Patient Detail</h2>

<div class="card p-3">

    <h4>{{ record.patient.full_name }}</h4>

    <p><b>Symptoms:</b> {{ record.symptoms }}</p>
    <p><b>Temperature:</b> {{ record.temperature }}</p>
    <p><b>Oxygen:</b> {{ record.oxygen_level }}</p>
    <p><b>Priority:</b> {{ record.priority_level }}</p>

</div>

{% endblock %}
